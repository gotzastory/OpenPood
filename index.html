<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: renderer never talks to APIs itself (all API calls live in the main
      process), so connect-src only needs the Vite dev server (HMR websocket).
      Google Fonts entries cover onboarding.css's @import.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPood</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
