name: Release

# Builds the Windows NSIS installer and attaches it to a GitHub Release
# whenever a version tag (v1.2.3) is pushed. Can also be run by hand from
# the Actions tab to produce a build artifact without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      # `npm run dist` passes --publish never: electron-builder otherwise
      # auto-publishes when it detects a git tag and fails without GH_TOKEN.
      # We publish explicitly below so the release notes stay under our control.
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify update artifacts
        run: node scripts/verify-update-artifacts.cjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenPood-Setup-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          notes_args=(--generate-notes)
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenPood ${GITHUB_REF_NAME#v}" \
            "${notes_args[@]}" \
            release/*.exe release/*.exe.blockmap release/latest.yml
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
