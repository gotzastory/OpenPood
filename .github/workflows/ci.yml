name: CI

# Typecheck, unit tests, Vite/Electron build, and a Linux electron-builder
# smoke pack (schema + packaging) so invalid builder config fails in PRs.
# Branch protection cannot be enabled from this workflow; require this check
# on `main` in the repository settings.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    # ubuntu-latest so `electron-builder --linux dir` runs natively; Windows/
    # macOS installer packaging remains covered by the Release workflow matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack Linux dir (electron-builder smoke)
        run: npx electron-builder --linux dir --publish never

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
