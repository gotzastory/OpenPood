name: CI

# Typecheck, unit tests, Vite/Electron build, and a Linux electron-builder
# smoke pack (dir + deb) so invalid builder config / missing Maintainer email
# fails in PRs. Branch protection cannot be enabled from this workflow; require
# this check on `main` in the repository settings.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    # ubuntu-latest so electron-builder can pack Linux targets natively; Windows/
    # macOS installer packaging remains covered by the Release workflow matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev

      - name: Pack Linux dir + deb (electron-builder smoke)
        # dir validates packaging; deb also requires author.email / Maintainer.
        # electron-builder downloads its own fpm binary; fakeroot/dpkg-dev cover host tooling.
        run: npx electron-builder --linux dir deb --publish never

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
